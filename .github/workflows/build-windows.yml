name: Build YellowPlanner Qt (single EXE)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'
      - 'version_info.txt'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Python on GitHub runner
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile YellowPlanner_Qt_1.0.py

      # PyInstaller анализирует реальные импорты приложения и добавляет
      # нужные Qt DLL/плагины. Не используем --collect-all PySide6.
      - name: Build single-file EXE
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --windowed
          --onefile
          --name YellowPlannerQt
          --hidden-import PySide6.QtSvg
          --version-file version_info.txt
          YellowPlanner_Qt_1.0.py

      - name: Add README and SHA256
        shell: pwsh
        run: |
          @'
          YellowPlanner Qt 1.0

          Запустите YellowPlannerQt.exe. Программа поставляется одним EXE.
          При первом запуске PyInstaller может распаковать временные библиотеки.

          Данные хранятся отдельно от программы:
          %APPDATA%\YellowPlanner\tasks.json

          Перед первым запуском сделайте резервную копию tasks.json и закройте старую версию YellowPlanner.
          Python на компьютере пользователя не требуется.
          '@ | Set-Content -Encoding UTF8 dist/README.txt
          $hash = (Get-FileHash dist/YellowPlannerQt.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  YellowPlannerQt.exe" | Set-Content -Encoding ASCII dist/YellowPlannerQt.exe.sha256

      - name: Upload single-file build
        uses: actions/upload-artifact@v4
        with:
          name: YellowPlannerQt-OneFile
          path: |
            dist/YellowPlannerQt.exe
            dist/README.txt
            dist/YellowPlannerQt.exe.sha256
          if-no-files-found: error
          retention-days: 30
